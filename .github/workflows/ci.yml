name: CI

on:
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_PUBLIC_API_BASE: https://api.example.test/api
      NUXT_PUBLIC_API_ORIGIN: https://api.example.test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      # Not blocking until the baseline errors are fixed (PRD Q4)
      - name: Typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # Tests that read .output (precache, fonts, prerender); fail if the build is missing
      - name: Build output tests
        run: npm run test:build
        env:
          REQUIRE_BUILD: '1'

      - name: Bundle budget
        run: npm run budget

      - name: Bundle analyze
        run: npx nuxi analyze --no-serve
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuxt-analyze
          path: |
            .nuxt/analyze
            node_modules/.cache/nuxt/.nuxt/analyze
          if-no-files-found: ignore
